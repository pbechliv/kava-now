# Managed by infra/maintenance/apply.sh — installed as
# /etc/systemd/system/apt-daily-upgrade.timer.d/kavanow.conf
#
# Ubuntu's stock timer fires at 06:00 with up to 60 min of jitter. With
# Automatic-Reboot-Time "03:30" the reboot then gets scheduled for the NEXT
# 03:30 — ~20 h after the packages land, meaning the box runs a patched disk
# on an unpatched kernel all day. Move the run just ahead of the reboot window.
[Timer]
OnCalendar=
OnCalendar=03:00
RandomizedDelaySec=15m
Persistent=true
